name: Deploy to Contabo k3s

on:
  push:
    branches: [master]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 2222 -H 169.58.234.131 >> ~/.ssh/known_hosts

      - name: Rsync source to server
        run: |
          rsync -azR -e "ssh -i ~/.ssh/deploy_key -p 2222" \
            internal cmd scripts config.yaml go.mod go.sum \
            resume/master.tex resume/facts.md \
            root@169.58.234.131:/tmp/jobwatch_deploy/

      - name: Install into PVC, rebuild binary, restart dashboard
        run: |
          ssh -i ~/.ssh/deploy_key -p 2222 root@169.58.234.131 '
            set -e
            PVC=$(kubectl get pv "$(kubectl get pvc jobwatch-data -o jsonpath={.spec.volumeName})" -o jsonpath={.spec.local.path})
            test -d "$PVC/internal"
            cp -a /tmp/jobwatch_deploy/. "$PVC/"
            rm -rf /tmp/jobwatch_deploy
            kubectl exec deploy/jobwatch -- bash -c "cd /opt/jobwatch && go build -o bin/jobwatch ./cmd/jobwatch"
            kubectl rollout restart deploy/jobwatch
            kubectl rollout status deploy/jobwatch --timeout=180s
          '
